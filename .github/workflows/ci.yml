name: ci

# Lint, types, tests et audit des dépendances sur chaque push vers main et chaque PR.
# Les actions sont épinglées par SHA de commit (mêmes SHA que release.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (version lue dans package.json)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Les contrats partagés sont consommés via leur dist : à construire avant lint et types.
      - run: pnpm --filter @solocast/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Audit des dépendances de production
        run: pnpm audit --prod --audit-level high
